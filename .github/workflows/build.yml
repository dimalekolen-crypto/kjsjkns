name: Build FlopDLC.dylib

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build universal FlopDLC.dylib
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          clang --version

      - name: Build universal dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          SOURCES=$(find src -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.m" -o -name "*.mm" \) 2>/dev/null || true)

          if [ -z "$SOURCES" ]; then
            echo "⚠️  no sources in src/, building stub"
            echo 'int flopdlc_init(void){return 0;}' > build/stub.c
            SOURCES="build/stub.c"
          fi

          if echo "$SOURCES" | grep -qE '\.(cpp|mm)$'; then
            CC=clang++; STD="-std=c++17"
          else
            CC=clang;  STD="-std=c11"
          fi

          echo "Compiler: $CC $STD"
          echo "Sources: $SOURCES"

          $CC -dynamiclib \
            -arch arm64 -arch x86_64 \
            -mmacosx-version-min=11.0 \
            -O2 -fPIC $STD \
            -Wl,-install_name,@rpath/FlopDLC.dylib \
            -o build/FlopDLC.dylib \
            $SOURCES

      - name: Verify
        run: |
          file build/FlopDLC.dylib
          lipo -info build/FlopDLC.dylib
          otool -L build/FlopDLC.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlopDLC.dylib
          path: build/FlopDLC.dylib
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/FlopDLC.dylib
